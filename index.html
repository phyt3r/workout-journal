<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Journal</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#76756f;--bd:#e3e1da;--ac:#d9a62b;--acx:#1c1c1a;--ok:#2f9e5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#161614;--tx:#f2f1ec;--mu:#8d8b84;--bd:#2a2a27;--ac:#e0b43a;--acx:#000;--ok:#4cc27d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#161614;--tx:#f2f1ec;--mu:#8d8b84;--bd:#2a2a27;--ac:#e0b43a;--acx:#000;--ok:#4cc27d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.hd b{font-size:15px}
.last{color:var(--mu);font-size:12px;margin-bottom:8px}
.plus{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap}
.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.set{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:8px 4px}
.set.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.set input{width:100%;text-align:center;font-size:17px;font-weight:600;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--bd);padding:2px 0;-moz-appearance:textfield}
.set small{color:var(--mu);font-size:11px}
.set button{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:none;color:var(--acx);font-size:16px;line-height:1}
.set.done button{background:var(--ok);border-color:var(--ok)}
.fin{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:700;margin-top:4px}
.h{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.h .t{display:flex;justify-content:space-between;font-weight:600}
.h .d{color:var(--mu);font-size:12px;margin-top:4px}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.note{color:var(--mu);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<h1>Workout Journal</h1>
<div class="sub">3 days a week · 4 × 10 · weights in kg</div>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<div class="note">Data is saved in this browser on this device only. Tap the weight to edit it; tap the circle when a set is done.</div>
<script>
var DEFAULT={
A:[["Leg press",[10,15,20,30]],["Barbell bench press",[5,7.5,10,10]],["Lat pulldown",[20,25,30,30]],["DB shoulder press",[8,10,10,10]],["Standing DB curl (superset)",[4,6,6,8]],["Overhead cable triceps (superset)",[7.5,10,12.5,12.5]],["Ab wheel / stick roll-out",null]],
B:[["Deadlift",[2.5,5,5,7.5]],["Floor DB press",[8,10,10,12]],["Cable row to eyes",[10,12.5,15,15]],["Seated hammer curl (superset)",[5,6,6,5]],["Dips (superset, assisted or bodyweight)",null],["Cable crunch",null]],
C:[["Leg press (superset)",[10,20,25,30]],["Seated calf raise (superset)",[0,5,10,10]],["One-arm DB row",[8,10,12,12]],["Cable fly",[2.5,5,5,7.5]],["Cable lateral raise",[2.5,2.5,5,5]],["Standing barbell curl (superset)",[10,12.5,12.5,12.5]],["Triceps cable (superset)",[10,12.5,12.5,12.5]],["Static abs (plank)",null]]
};
var DAYS=["A","B","C"],LABEL={A:"Day 1 · A",B:"Day 2 · B",C:"Day 3 · C"};
var plan,log=[],checks={},view="A";
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function init(){
  plan=load("wk_plan2",null);
  if(!plan){plan={};DAYS.forEach(function(d){plan[d]=DEFAULT[d].map(function(e){return{n:e[0],w:e[1]?e[1].slice():null}})})}
  log=load("wk_log",[]);
  render();
}
function lastFor(day,name){
  for(var i=log.length-1;i>=0;i--){
    if(log[i].day!==day)continue;
    var x=log[i].ex.filter(function(e){return e.n===name})[0];
    if(x&&x.w)return x.w.join(" / ");
    if(x)return "done";
  }
  return null;
}
function render(){
  var t=document.getElementById("tabs");
  t.innerHTML="";
  DAYS.concat(["H"]).forEach(function(d){
    var b=document.createElement("button");
    b.textContent=d==="H"?"History":LABEL[d];
    if(d===view)b.className="on";
    b.onclick=function(){view=d;render()};
    t.appendChild(b);
  });
  var m=document.getElementById("main");
  m.innerHTML="";
  if(view==="H"){renderHistory(m);return}
  plan[view].forEach(function(ex,i){
    var key=view+i;
    if(!checks[key])checks[key]=[false,false,false,false];
    var card=document.createElement("div");card.className="ex";
    var hd=document.createElement("div");hd.className="hd";
    var nm=document.createElement("b");nm.textContent=ex.n;hd.appendChild(nm);
    if(ex.w){
      var bx=document.createElement("div");bx.style.cssText="display:flex;gap:6px";
      [-0.5,0.5].forEach(function(dl){
        var p=document.createElement("button");p.className="plus";p.textContent=(dl<0?"\u22120.5":"+0.5");
        p.onclick=function(){ex.w=ex.w.map(function(x){return Math.max(0,Math.round((x+dl)*10)/10)});save("wk_plan2",plan);render()};
        bx.appendChild(p);
      });
      hd.appendChild(bx);
    }
    card.appendChild(hd);
    var lf=lastFor(view,ex.n);
    if(lf){var l=document.createElement("div");l.className="last";l.textContent="Last time: "+lf;card.appendChild(l)}
    var g=document.createElement("div");g.className="sets";
    for(var s=0;s<4;s++)(function(s){
      var c=document.createElement("div");c.className="set"+(checks[key][s]?" done":"");
      if(ex.w){
        var inp=document.createElement("input");inp.type="number";inp.step="0.5";inp.inputMode="decimal";inp.value=ex.w[s];
        inp.onchange=function(){ex.w[s]=parseFloat(inp.value)||0;save("wk_plan2",plan)};
        c.appendChild(inp);
      }else{var bw=document.createElement("small");bw.textContent="body";c.appendChild(bw)}
      var sm=document.createElement("small");sm.textContent="× 10";c.appendChild(sm);
      var b=document.createElement("button");b.textContent=checks[key][s]?"✓":"";
      b.onclick=function(){checks[key][s]=!checks[key][s];render()};
      c.appendChild(b);g.appendChild(c);
    })(s);
    card.appendChild(g);m.appendChild(card);
  });
  var f=document.createElement("button");f.className="fin";f.textContent="Finish workout";
  f.onclick=function(){
    var ex=plan[view].map(function(e,i){
      return{n:e.n,w:e.w?e.w.slice():null,done:(checks[view+i]||[]).filter(Boolean).length};
    });
    log.push({date:new Date().toISOString(),day:view,ex:ex});
    save("wk_log",log);
    for(var i=0;i<plan[view].length;i++)delete checks[view+i];
    view="H";render();
  };
  m.appendChild(f);
}
function renderHistory(m){
  if(!log.length){var e=document.createElement("div");e.className="empty";e.textContent="No workouts logged yet.";m.appendChild(e);return}
  log.slice().reverse().forEach(function(s){
    var total=s.ex.reduce(function(a,e){return a+e.done},0),max=s.ex.length*4;
    var d=new Date(s.date);
    var h=document.createElement("div");h.className="h";
    var t=document.createElement("div");t.className="t";
    var a=document.createElement("span");a.textContent="Workout "+s.day;
    var b=document.createElement("span");b.textContent=d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
    t.appendChild(a);t.appendChild(b);h.appendChild(t);
    var x=document.createElement("div");x.className="d";
    x.textContent=total+" of "+max+" sets done · "+s.ex.filter(function(e){return e.w}).map(function(e){return e.n+": "+e.w.join("/")}).join(" · ");
    h.appendChild(x);m.appendChild(h);
  });
}
init();
</script>
</body>
</html>
