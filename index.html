<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Journal</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#76756f;--bd:#e3e1da;--ac:#d9a62b;--acx:#1c1c1a;--ok:#2f9e5b;--bad:#d4493b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#161614;--tx:#f2f1ec;--mu:#8d8b84;--bd:#2a2a27;--ac:#e0b43a;--acx:#000;--ok:#4cc27d;--bad:#ef6a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#161614;--tx:#f2f1ec;--mu:#8d8b84;--bd:#2a2a27;--ac:#e0b43a;--acx:#000;--ok:#4cc27d;--bad:#ef6a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:560px;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.edt{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.edt.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;padding:10px 14px;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.hd b{font-size:15px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;font-size:13px;color:var(--mu)}
.fld{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:15px;min-width:0}
.fld.n{width:56px;text-align:center}
.fld.w{flex:1}
textarea.fld{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.last{color:var(--mu);font-size:12px;margin-bottom:8px}
.plus{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:4px 9px;font-size:13px;white-space:nowrap}
.danger{color:var(--bad)}
.sets{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px;margin-top:6px}
.set{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:8px 4px}
.set.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.set input{width:100%;text-align:center;font-size:17px;font-weight:600;background:transparent;color:var(--tx);border:0;border-bottom:1px solid var(--bd);padding:2px 0;border-radius:0}
.set small{color:var(--mu);font-size:11px}
.set button{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:none;color:var(--acx);font-size:16px;line-height:1}
.set.done button{background:var(--ok);border-color:var(--ok)}
.fin{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:700;margin-top:4px}
.fin.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.h{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.h .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.h .d{color:var(--mu);font-size:12px;margin-top:4px}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.msg{color:var(--mu);font-size:13px;margin:8px 0;min-height:18px}
.note{color:var(--mu);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="top"><h1>Workout Journal</h1><button id="edt" class="edt"></button></div>
<div class="sub">Your plan, your weights · kg</div>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<div class="note">Data is saved in this browser on this device only. Use Data → Export to back it up or move it to another device.</div>
<script>
var DEF=[
["Day 1 · A",[["Leg press",[10,15,20,30]],["Barbell bench press",[5,7.5,10,10]],["Lat pulldown",[20,25,30,30]],["DB shoulder press",[8,10,10,10]],["Standing DB curl (superset)",[4,6,6,8]],["Overhead cable triceps (superset)",[7.5,10,12.5,12.5]],["Ab wheel / stick roll-out",null]]],
["Day 2 · B",[["Deadlift",[2.5,5,5,7.5]],["Floor DB press",[8,10,10,12]],["Cable row to eyes",[10,12.5,15,15]],["Seated hammer curl (superset)",[5,6,6,5]],["Dips (superset, assisted or bodyweight)",null],["Cable crunch",null]]],
["Day 3 · C",[["Leg press (superset)",[10,20,25,30]],["Seated calf raise (superset)",[0,5,10,10]],["One-arm DB row",[8,10,12,12]],["Cable fly",[2.5,5,5,7.5]],["Cable lateral raise",[2.5,2.5,5,5]],["Standing barbell curl (superset)",[10,12.5,12.5,12.5]],["Triceps cable (superset)",[10,12.5,12.5,12.5]],["Static abs (plank)",null]]]
];
var S,checks={},view=0,edit=false;
function h(t,p,c){var e=document.createElement(t);p=p||{};for(var k in p){var v=p[k];if(k==="text")e.textContent=v;else if(k==="class")e.className=v;else if(k==="value")e.value=v;else if(k==="checked")e.checked=v;else if(k.slice(0,2)==="on")e[k]=v;else e.setAttribute(k,v)}(c||[]).forEach(function(x){e.appendChild(x)});return e}
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function sv(){try{localStorage.setItem("wk_state3",JSON.stringify(S))}catch(e){}}
function mkEx(n,r,w){return{n:n,reps:r,bw:!w,w:w?w.slice():[0,0,0,0]}}
function fromDef(){return DEF.map(function(d){return{name:d[0],ex:d[1].map(function(e){return mkEx(e[0],10,e[1])})}})}
function init(){
  S=load("wk_state3",null);
  if(!S||!Array.isArray(S.days)){
    var op=load("wk_plan2",null),ol=load("wk_log",[]),nm={A:"Day 1 · A",B:"Day 2 · B",C:"Day 3 · C"};
    S={days:fromDef(),log:[]};
    if(op){
      S.days=["A","B","C"].filter(function(k){return op[k]}).map(function(k){return{name:nm[k],ex:op[k].map(function(e){return mkEx(e.n,10,e.w)})}});
      S.log=ol.map(function(l){return{date:l.date,day:nm[l.day]||l.day,ex:l.ex.map(function(e){return{n:e.n,reps:10,bw:!e.w,w:e.w,t:4,done:e.done}})}});
    }
    sv();
  }
  document.getElementById("edt").onclick=function(){edit=!edit;if(edit&&typeof view!=="number")view=0;render()};
  render();
}
function btn(t,f,cls){return h("button",{class:"plus"+(cls?" "+cls:""),text:t,onclick:f})}
function cbtn(label,f,off){var b=btn(label,null,"danger"),t;if(off){b.disabled=true;b.style.opacity=0.4;b.title="Keep at least one day"}b.onclick=function(){if(b.dataset.arm){clearTimeout(t);f();return}b.dataset.arm=1;b.textContent="Tap again to confirm";t=setTimeout(function(){delete b.dataset.arm;b.textContent=label},3000)};return b}
function tab(label,v){return h("button",{class:v===view?"on":"",text:label,onclick:function(){view=v;render()}})}
function render(){
  var T=document.getElementById("tabs");T.innerHTML="";
  S.days.forEach(function(d,i){T.appendChild(tab(d.name,i))});
  if(edit)T.appendChild(h("button",{text:"+ Day",onclick:function(){S.days.push({name:"Day "+(S.days.length+1),ex:[]});sv();view=S.days.length-1;checks={};render()}}));
  T.appendChild(tab("History","H"));T.appendChild(tab("Data","D"));
  var E=document.getElementById("edt");E.textContent=edit?"Done":"Edit plan";E.className="edt"+(edit?" on":"");
  var m=document.getElementById("main");m.innerHTML="";
  if(view==="H")return hist(m);
  if(view==="D")return data(m);
  if(!S.days[view])view=0;
  day(m);
}
function last(dn,en){
  for(var i=S.log.length-1;i>=0;i--){
    if(S.log[i].day!==dn)continue;
    var x=S.log[i].ex.filter(function(e){return e.n===en})[0];
    if(x)return (x.w?x.w.join(" / "):"bodyweight")+" × "+(x.reps||10);
  }
  return null;
}
function nudge(ex,dl){return btn(dl<0?"−0.5":"+0.5",function(){ex.w=ex.w.map(function(x){return Math.max(0,Math.round((x+dl)*10)/10)});sv();render()})}
function mv(d,i,dir){var j=i+dir;if(j<0||j>=d.ex.length)return;var t=d.ex[i];d.ex[i]=d.ex[j];d.ex[j]=t;checks={};sv();render()}
function setsBy(ex,dl){if(dl>0)ex.w.push(ex.w[ex.w.length-1]||0);else if(ex.w.length>1)ex.w.pop();checks={};sv();render()}
function card(d,ex,i){
  var key=view+"_"+i,ck=checks[key]=checks[key]||[];
  var c=h("div",{class:"ex"}),hd=h("div",{class:"hd"});
  if(edit){
    hd.appendChild(h("input",{class:"fld w",value:ex.n,onchange:function(){ex.n=this.value||"Exercise";sv()}}));
    hd.appendChild(h("div",{style:"display:flex;gap:6px"},[btn("↑",function(){mv(d,i,-1)}),btn("↓",function(){mv(d,i,1)}),btn("✕",function(){d.ex.splice(i,1);checks={};sv();render()},"danger")]));
  }else{
    hd.appendChild(h("b",{text:ex.n}));
    if(!ex.bw)hd.appendChild(h("div",{style:"display:flex;gap:6px"},[nudge(ex,-0.5),nudge(ex,0.5)]));
  }
  c.appendChild(hd);
  var r=h("div",{class:"row"},[h("span",{text:"Reps"}),h("input",{class:"fld n",type:"text",inputmode:"numeric",value:ex.reps,onchange:function(){ex.reps=Math.max(1,parseInt(this.value,10)||10);sv();render()}})]);
  if(edit){
    r.appendChild(h("span",{text:"Sets"}));
    r.appendChild(btn("−",function(){setsBy(ex,-1)}));
    r.appendChild(h("span",{text:String(ex.w.length)}));
    r.appendChild(btn("+",function(){setsBy(ex,1)}));
    r.appendChild(h("label",{},[h("input",{type:"checkbox",checked:ex.bw,onchange:function(){ex.bw=this.checked;sv();render()}}),h("span",{text:" Bodyweight"})]));
  }
  c.appendChild(r);
  var lf=last(d.name,ex.n);
  if(lf&&!edit)c.appendChild(h("div",{class:"last",text:"Last time: "+lf}));
  var n=ex.w.length,g=h("div",{class:"sets",style:"--n:"+(n<=5?n:Math.ceil(n/2))});
  ex.w.forEach(function(wt,s){
    var cell=h("div",{class:"set"+(ck[s]?" done":"")});
    if(ex.bw)cell.appendChild(h("small",{text:"body"}));
    else cell.appendChild(h("input",{type:"text",inputmode:"decimal",value:wt,onchange:function(){var v=parseFloat(String(this.value).replace(",","."));ex.w[s]=isNaN(v)?0:Math.max(0,v);this.value=ex.w[s];sv()}}));
    cell.appendChild(h("small",{text:"× "+ex.reps}));
    cell.appendChild(h("button",{text:ck[s]?"✓":"",onclick:function(){ck[s]=!ck[s];render()}}));
    g.appendChild(cell);
  });
  c.appendChild(g);
  return c;
}
function day(m){
  var d=S.days[view];
  if(edit)m.appendChild(h("div",{class:"ex"},[h("div",{class:"row"},[
    h("input",{class:"fld w",value:d.name,onchange:function(){d.name=this.value||"Day";sv();render()}}),
    cbtn("Delete day",function(){
      S.days.splice(view,1);view=0;checks={};sv();render();
    },S.days.length<2)])]));
  d.ex.forEach(function(ex,i){m.appendChild(card(d,ex,i))});
  if(edit)m.appendChild(h("button",{class:"fin alt",text:"+ Add exercise",onclick:function(){d.ex.push(mkEx("New exercise",10,[0,0,0,0]));sv();render()}}));
  else if(d.ex.length)m.appendChild(h("button",{class:"fin",text:"Finish workout",onclick:function(){
    S.log.push({date:new Date().toISOString(),day:d.name,ex:d.ex.map(function(e,i){return{n:e.n,reps:e.reps,bw:e.bw,w:e.bw?null:e.w.slice(),t:e.w.length,done:(checks[view+"_"+i]||[]).filter(Boolean).length}})});
    checks={};sv();view="H";render();
  }}));
}
function hist(m){
  if(!S.log.length){m.appendChild(h("div",{class:"empty",text:"No workouts logged yet."}));return}
  for(var i=S.log.length-1;i>=0;i--)(function(i){
    var s=S.log[i],tot=0,max=0;
    s.ex.forEach(function(e){tot+=e.done;max+=e.t||4});
    var dt=new Date(s.date).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
    var sm=s.ex.map(function(e){return e.n+": "+(e.w?e.w.join("/")+" × "+(e.reps||10):e.done+"/"+(e.t||4)+" sets × "+(e.reps||10))}).join(" · ");
    m.appendChild(h("div",{class:"h"},[
      h("div",{class:"t"},[h("span",{text:s.day}),h("span",{style:"display:flex;gap:8px;align-items:center"},[h("span",{text:dt}),cbtn("✕",function(){S.log.splice(i,1);sv();render()})])]),
      h("div",{class:"d",text:tot+" of "+max+" sets done · "+sm})]));
  })(i);
}
function data(m){
  var ta=h("textarea",{class:"fld",rows:"10",placeholder:"Export fills this box. Paste exported JSON here to import."});
  var ms=h("div",{class:"msg"}),fi=h("input",{type:"file",accept:".json,application/json",style:"display:none"});
  function say(t){ms.textContent=t}
  fi.onchange=function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){doImport(r.result,say)};r.readAsText(f);fi.value=""};
  m.appendChild(h("div",{class:"ex"},[
    h("div",{class:"row",text:"Export saves your days, exercises, reps, weights and history. Import replaces what is on this device."}),
    ta,
    h("div",{class:"row"},[
      btn("Export",function(){
        var j=JSON.stringify({app:"workout-journal",version:3,days:S.days,log:S.log},null,2);ta.value=j;
        try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="workout-journal-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove()}catch(e){}
        say("Exported. If no file downloaded, copy the text above.");
      }),
      btn("Import pasted JSON",function(){doImport(ta.value,say)}),
      btn("Import file",function(){fi.click()})]),
    ms,fi]));
}
function doImport(txt,say){
  try{
    var o=JSON.parse(txt);
    if(!o||!Array.isArray(o.days)||!o.days.length)throw 0;
    o.days.forEach(function(d){
      if(typeof d.name!=="string"||!Array.isArray(d.ex))throw 0;
      d.ex.forEach(function(e){if(!Array.isArray(e.w)||!e.w.length)throw 0;e.n=String(e.n||"Exercise");e.reps=parseInt(e.reps,10)||10;e.bw=!!e.bw;e.w=e.w.map(function(x){return parseFloat(x)||0})});
    });
    S={days:o.days,log:Array.isArray(o.log)?o.log:[]};sv();checks={};view=0;edit=false;render();
  }catch(e){say("That doesn’t look like a valid export.")}
}
init();
</script>
</body>
</html>
